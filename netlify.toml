# Netlify build settings (read automatically on every deploy).
# Netlify detects Next.js and adds its Next.js runtime, which serves the
# server-rendered pages, server actions, and proxy from the .next output.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9 or newer
  NODE_VERSION = "22"

# Netlify's Next.js runtime: turns the build into server functions and
# routing (server pages, server actions, proxy). Netlify didn't attach it
# automatically for this site, so it's listed explicitly.
[[plugins]]
  package = "@netlify/plugin-nextjs"
