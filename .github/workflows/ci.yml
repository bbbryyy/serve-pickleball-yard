name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read # gitleaks lists the PR's commits to scan them

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches NODE_VERSION in netlify.toml
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Route types (PageProps, LayoutProps) and next-env.d.ts are generated
      # by Next.js and are not committed, so generate them before tsc.
      - name: Type-check
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Test
        run: npm test

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full git history, not just the last commit

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
